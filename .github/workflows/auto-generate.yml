name: "🐾 Schedule-Driven Motorsport & Maintenance Auto-Publisher"

on:
  schedule:
    # [週1回 スケジュールDB同期] 毎週火曜 09:00 JST (00:00 UTC):
    # 年間スケジュール（特に12〜2月発表分）および全国・世界各サーキットの更新を確認しDBへ反映
    - cron: "0 0 * * 2"

    # [1. 世界戦プレビュー] 毎週木曜 09:00 JST (00:00 UTC):
    # 今週末の MotoGP / WorldSBK 開催プレビュー（開催がなければスキップ）
    - cron: "0 0 * * 4"

    # [2. 日本国内プレビュー] 毎週金曜 09:00 JST (00:00 UTC):
    # 今週末に日本各地で開催されるレースの開催プレビュー（開催がなければスキップ）
    - cron: "0 0 * * 5"

    # [3. レース結果ダイジェスト1] 毎週月曜 09:00 JST (00:00 UTC):
    # 週末のレース結果（ネットから取得できたもののみ掲載 / 世界戦と国内戦は別記事に分割 / なければスキップ）
    - cron: "0 0 * * 1"

    # [4. レース結果ダイジェスト2] 毎週水曜 09:00 JST (00:00 UTC):
    # ダイジェスト1で結果未取得だったレースの再収集（取得できれば掲載 / 該当なしはスキップ）
    - cron: "0 0 * * 3"

    # [週1回 メンテナンス＆豆知識連載] 毎週水曜 12:00 JST (03:00 UTC):
    # サーキット走行向けバイクメンテナンス情報・豆知識
    - cron: "0 3 * * 3"

  workflow_dispatch:
    inputs:
      task:
        description: "実行タスク種別"
        required: true
        default: "custom"
        type: choice
        options:
          - custom
          - sync_schedule
          - preview_world
          - preview_japan
          - digest_monday
          - digest_wednesday
          - maintenance
      topic:
        description: "カスタムお題（手動実行時：任意のトピックを指定して1クリック生成）"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-scheduled-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI Pipeline Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve Scheduled Task from Cron or Manual Input
        id: resolve_task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 2" ]; then
            echo "task=sync_schedule" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 4" ]; then
            echo "task=preview_world" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 5" ]; then
            echo "task=preview_japan" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then
            echo "task=digest_monday" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * 3" ]; then
            echo "task=digest_wednesday" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 3 * * 3" ]; then
            echo "task=maintenance" >> $GITHUB_OUTPUT
          else
            echo "task=sync_schedule" >> $GITHUB_OUTPUT
          fi

      - name: Execute Weekly Schedule Sync or Schedule-Driven Article Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TASK="${{ steps.resolve_task.outputs.task }}"
          echo "Running pipeline task: $TASK"
          if [ "$TASK" = "sync_schedule" ]; then
            python3 scripts/collect_schedules.py
          elif [ -n "${{ inputs.topic }}" ]; then
            python3 scripts/generate_articles.py --mode "$TASK" --topic "${{ inputs.topic }}"
          else
            python3 scripts/generate_articles.py --mode "$TASK"
          fi

      - name: Audit Schedule DB & Articles Integrity
        run: |
          python3 scripts/collect_schedules.py --dry-run
          python3 scripts/generate_articles.py --dry-run

      - name: Commit & Push If Schedule DB or New Articles Were Generated
        run: |
          git config user.name "honda-cat-editorial-bot"
          git config user.email "bot@honda.cat"
          git add src/data/schedules.json src/data/articles/*.json
          if git diff --staged --quiet; then
            echo "⏭️ No changes or skipped task (${{ steps.resolve_task.outputs.task }}); nothing to commit."
          else
            git commit -m "chore(pipeline): automated update via ${{ steps.resolve_task.outputs.task }}"
            git push
          fi
