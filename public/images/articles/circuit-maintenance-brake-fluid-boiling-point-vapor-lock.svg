<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad2)" />

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient light -->
  <circle cx="950" cy="300" r="260" fill="#e63946" opacity="0.12" filter="url(#glow2)" />
  <circle cx="300" cy="200" r="200" fill="#c77dff" opacity="0.08" filter="url(#glow2)" />

  <!-- Typography -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#c77dff" opacity="0.2" stroke="#c77dff" stroke-width="1.5" />
    <text x="110" y="22" text-anchor="middle" fill="#c77dff" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" letter-spacing="2">NAOMI'S WORKSHOP #2</text>

    <text x="0" y="90" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="44" font-weight="900" letter-spacing="1">ブレーキフルード沸点と科学</text>
    <text x="0" y="145" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700">JIS K 2233 BOILING POINTS &amp; VAPOR LOCK</text>
    <text x="0" y="195" fill="#a8b3cf" font-family="'Noto Sans JP', sans-serif" font-size="18">水分3.7%で沸点75℃急降下 · キャリパー過熱200℃ · 確実なエア抜き</text>

    <!-- Spectrum Card -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#151922" stroke="#e63946" stroke-width="1.5" opacity="0.9" />
      <text x="25" y="38" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">TEMPERATURE CRITICAL THRESHOLDS</text>
      
      <circle cx="35" cy="72" r="5" fill="#7209b7" />
      <text x="50" y="77" fill="#f4f6fb" font-size="15">Racing DOT4 (Dry): 328℃ (水分0% 新品)</text>

      <circle cx="35" cy="104" r="5" fill="#2a9d8f" />
      <text x="50" y="109" fill="#f4f6fb" font-size="15">DOT4 Dry Boiling Point: 230℃以上 (JIS規格)</text>

      <circle cx="35" cy="134" r="5" fill="#e63946" />
      <text x="50" y="139" fill="#ff758f" font-size="15" font-weight="700">DOT4 Wet Boiling Point: 155℃ (水分3.7%吸湿)</text>
    </g>
  </g>

  <!-- Right Graphic: Caliper, Glowing Rotor & Bubbles -->
  <g transform="translate(850, 315)">
    <!-- Glowing Brake Rotor Segment -->
    <path d="M -150,-150 A 240 240 0 0 1 -150,150" fill="none" stroke="#ff758f" stroke-width="24" opacity="0.75" />
    <path d="M -150,-150 A 240 240 0 0 1 -150,150" fill="none" stroke="#ffb703" stroke-width="10" opacity="0.9" />

    <!-- Brake Caliper Body -->
    <rect x="-100" y="-120" width="220" height="240" rx="18" fill="#1b202c" stroke="#4895ef" stroke-width="6" />
    <circle cx="10" cy="-45" r="45" fill="#151922" stroke="#4895ef" stroke-width="4" />
    <circle cx="10" cy="55" r="45" fill="#151922" stroke="#4895ef" stroke-width="4" />
    <text x="10" y="-40" text-anchor="middle" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="700">PISTON 1</text>
    <text x="10" y="60" text-anchor="middle" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="700">PISTON 2</text>

    <!-- Bleed Nipple at top -->
    <rect x="30" y="-150" width="16" height="30" rx="3" fill="#a8b3cf" stroke="#fff" stroke-width="2" />
    <circle cx="38" cy="-145" r="4" fill="#ffd166" />
    <text x="55" y="-135" fill="#2a9d8f" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700">BLEEDER</text>

    <!-- Steam Bubbles inside Fluid Passage -->
    <circle cx="-35" cy="-20" r="10" fill="#ffd166" stroke="#e63946" stroke-width="2" />
    <circle cx="-45" cy="15" r="14" fill="#ffd166" stroke="#e63946" stroke-width="2" />
    <circle cx="-25" cy="35" r="8" fill="#ffd166" stroke="#e63946" stroke-width="2" />

    <!-- Warning Callout -->
    <g transform="translate(130, 20)">
      <rect x="0" y="0" width="150" height="70" rx="8" fill="#151922" stroke="#e63946" stroke-width="2" />
      <text x="75" y="28" text-anchor="middle" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="900">VAPOR LOCK</text>
      <text x="75" y="48" text-anchor="middle" fill="#f4f6fb" font-size="11">気泡圧縮 → 油圧喪失</text>
    </g>
  </g>

  <text x="80" y="580" fill="#707d9c" font-family="'Chakra Petch', sans-serif" font-size="14" letter-spacing="1">HONDA.CAT · NAOMI'S CIRCUIT MAINTENANCE CLINIC · ISSUE #2</text>
</svg>
