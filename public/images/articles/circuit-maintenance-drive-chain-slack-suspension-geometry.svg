<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad4)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="300" r="260" fill="#2a9d8f" opacity="0.12" filter="url(#glow4)" />
  <circle cx="280" cy="220" r="200" fill="#c77dff" opacity="0.08" filter="url(#glow4)" />

  <!-- Typography -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#c77dff" opacity="0.2" stroke="#c77dff" stroke-width="1.5" />
    <text x="110" y="22" text-anchor="middle" fill="#c77dff" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" letter-spacing="2">NAOMI'S WORKSHOP #4</text>

    <text x="0" y="90" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="44" font-weight="900" letter-spacing="1">ドライブチェーンと幾何学</text>
    <text x="0" y="145" fill="#ffd166" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700">SWINGARM KINEMATICS &amp; 520 CONVERSION</text>
    <text x="0" y="195" fill="#a8b3cf" font-family="'Noto Sans JP', sans-serif" font-size="18">3軸一直線の最大張り · サスストローク拘束防止 · 520化で+1.5〜3ps向上</text>

    <!-- Specs Box -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#151922" stroke="#ffd166" stroke-width="1.5" opacity="0.9" />
      <text x="25" y="38" fill="#ffd166" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">CHAIN GEOMETRY SPEC</text>
      
      <circle cx="35" cy="72" r="5" fill="#ffd166" />
      <text x="50" y="77" fill="#f4f6fb" font-size="15">Max Span: スプロケ・ピボット・アクスル一直線</text>

      <circle cx="35" cy="104" r="5" fill="#2a9d8f" />
      <text x="50" y="109" fill="#f4f6fb" font-size="15">Slack Target: たわみ量 25〜35mm (レース車30〜40mm)</text>

      <circle cx="35" cy="134" r="5" fill="#c77dff" />
      <text x="50" y="139" fill="#f4f6fb" font-size="15">Rivet Flare: デジタルノギス実測 ±0.1mm 管理</text>
    </g>
  </g>

  <!-- Right Graphic: 3-Axis Swingarm Geometry -->
  <g transform="translate(850, 315)">
    <!-- Engine Countershaft -->
    <circle cx="-180" cy="0" r="45" fill="#1b202c" stroke="#4895ef" stroke-width="5" />
    <circle cx="-180" cy="0" r="10" fill="#4895ef" />
    <text x="-180" y="-55" text-anchor="middle" fill="#4895ef" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700">SPROCKET</text>

    <!-- Swingarm Pivot -->
    <circle cx="-60" cy="0" r="24" fill="#151922" stroke="#ffb703" stroke-width="4" />
    <circle cx="-60" cy="0" r="8" fill="#ffb703" />
    <text x="-60" y="-40" text-anchor="middle" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="700">PIVOT</text>

    <!-- Max Alignment Line -->
    <line x1="-180" y1="0" x2="220" y2="0" stroke="#e63946" stroke-width="3" stroke-dasharray="8,6" />
    <text x="50" y="-15" text-anchor="middle" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700">STRAIGHT-LINE ALIGNMENT</text>

    <!-- Rear Sprocket & Axle -->
    <circle cx="220" cy="0" r="80" fill="#1b202c" stroke="#2a9d8f" stroke-width="6" />
    <circle cx="220" cy="0" r="16" fill="#2a9d8f" />
    <text x="220" y="-95" text-anchor="middle" fill="#2a9d8f" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700">REAR AXLE</text>

    <!-- Gold 520 Chain Path -->
    <path d="M -180,-45 L 220,-80" stroke="#ffd166" stroke-width="6" />
    <path d="M -180,45 Q 20,80 220,80" stroke="#ffd166" stroke-width="6" />
    <text x="20" y="115" text-anchor="middle" fill="#ffd166" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">↕ SLACK 30mm</text>
  </g>

  <text x="80" y="580" fill="#707d9c" font-family="'Chakra Petch', sans-serif" font-size="14" letter-spacing="1">HONDA.CAT · NAOMI'S CIRCUIT MAINTENANCE CLINIC · ISSUE #4</text>
</svg>
