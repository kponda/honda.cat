<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad6)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="300" r="260" fill="#4895ef" opacity="0.12" filter="url(#glow6)" />
  <circle cx="280" cy="220" r="200" fill="#c77dff" opacity="0.08" filter="url(#glow6)" />

  <!-- Typography -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#c77dff" opacity="0.2" stroke="#c77dff" stroke-width="1.5" />
    <text x="110" y="22" text-anchor="middle" fill="#c77dff" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" letter-spacing="2">NAOMI'S WORKSHOP #6</text>

    <text x="0" y="90" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="44" font-weight="900" letter-spacing="1">サーキット冷却水の真実</text>
    <text x="0" y="145" fill="#4895ef" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700">WHY LLC IS BANNED &amp; PURE WATER PHYSICS</text>
    <text x="0" y="195" fill="#a8b3cf" font-family="'Noto Sans JP', sans-serif" font-size="18">エチレングリコール油膜の危険 · 純水比熱4.18で水温5℃低下 · 冬期0℃凍結防止</text>

    <!-- Specs Box -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#151922" stroke="#4895ef" stroke-width="1.5" opacity="0.9" />
      <text x="25" y="38" fill="#4895ef" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">COOLING &amp; REGULATION SPEC</text>
      
      <circle cx="35" cy="72" r="5" fill="#e63946" />
      <text x="50" y="77" fill="#f4f6fb" font-size="15">MFJ Rule: エチレングリコール系LLC使用厳禁</text>

      <circle cx="35" cy="104" r="5" fill="#2a9d8f" />
      <text x="50" y="109" fill="#f4f6fb" font-size="15">Pure Water: 比熱 4.18 J/g・K (熱容量20%増で水温低下)</text>

      <circle cx="35" cy="134" r="5" fill="#ffb703" />
      <text x="50" y="139" fill="#f4f6fb" font-size="15">Winter Risk: 0℃で体積+9%膨張 (オフ期水抜き必須)</text>
    </g>
  </g>

  <!-- Right Graphic: Radiator & Pure Water Drop vs LLC Skull -->
  <g transform="translate(850, 315)">
    <!-- Radiator Outline -->
    <rect x="-140" y="-120" width="280" height="240" rx="12" fill="#1b202c" stroke="#4895ef" stroke-width="5" />
    <!-- Radiator Fins -->
    <g stroke="#3a4055" stroke-width="2">
      <line x1="-120" y1="-80" x2="120" y2="-80" />
      <line x1="-120" y1="-40" x2="120" y2="-40" />
      <line x1="-120" y1="0" x2="120" y2="0" />
      <line x1="-120" y1="40" x2="120" y2="40" />
      <line x1="-120" y1="80" x2="120" y2="80" />
    </g>

    <!-- Water Drop Core -->
    <circle cx="0" cy="0" r="55" fill="#151922" stroke="#2a9d8f" stroke-width="4" />
    <text x="0" y="-5" text-anchor="middle" fill="#2a9d8f" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="900">PURE H2O</text>
    <text x="0" y="18" text-anchor="middle" fill="#f4f6fb" font-size="11">比熱 4.18</text>
    <text x="0" y="32" text-anchor="middle" fill="#ffb703" font-size="10" font-weight="700">-5℃ 水温低下</text>

    <!-- Warning Badge -->
    <g transform="translate(-160, 60)">
      <rect x="0" y="0" width="130" height="45" rx="6" fill="#151922" stroke="#e63946" stroke-width="2" />
      <text x="65" y="28" text-anchor="middle" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="900">NO GLYCOL</text>
    </g>
  </g>

  <text x="80" y="580" fill="#707d9c" font-family="'Chakra Petch', sans-serif" font-size="14" letter-spacing="1">HONDA.CAT · NAOMI'S CIRCUIT MAINTENANCE CLINIC · ISSUE #6</text>
</svg>
