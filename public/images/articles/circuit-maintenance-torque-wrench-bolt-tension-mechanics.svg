<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad5)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <circle cx="950" cy="300" r="260" fill="#e63946" opacity="0.12" filter="url(#glow5)" />
  <circle cx="280" cy="220" r="200" fill="#c77dff" opacity="0.08" filter="url(#glow5)" />

  <!-- Typography -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#c77dff" opacity="0.2" stroke="#c77dff" stroke-width="1.5" />
    <text x="110" y="22" text-anchor="middle" fill="#c77dff" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" letter-spacing="2">NAOMI'S WORKSHOP #5</text>

    <text x="0" y="90" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="44" font-weight="900" letter-spacing="1">トルクレンチとボルト軸力</text>
    <text x="0" y="145" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700">TORQUE ≠ TENSION &amp; 90% FRICTION LOSS</text>
    <text x="0" y="195" fill="#a8b3cf" font-family="'Noto Sans JP', sans-serif" font-size="18">トルクの90%は摩擦に消える · 脱脂指定に給油で軸力2倍暴走 · 二度締め厳禁</text>

    <!-- Specs Box -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#151922" stroke="#ff758f" stroke-width="1.5" opacity="0.9" />
      <text x="25" y="38" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">FASTENER MECHANICS LAWS</text>
      
      <circle cx="35" cy="72" r="5" fill="#e63946" />
      <text x="50" y="77" fill="#f4f6fb" font-size="15">Equation: T = k・d・F (トルクの約90%は摩擦熱)</text>

      <circle cx="35" cy="104" r="5" fill="#ffb703" />
      <text x="50" y="109" fill="#f4f6fb" font-size="15">Operation:「カチッ」で即脱力 (二度締め追い締め厳禁)</text>

      <circle cx="35" cy="134" r="5" fill="#2a9d8f" />
      <text x="50" y="139" fill="#f4f6fb" font-size="15">Storage: 使用後は必ず「最低目盛」に戻して保管</text>
    </g>
  </g>

  <!-- Right Graphic: 90% Friction Donut & Click Torque Wrench -->
  <g transform="translate(850, 315)">
    <!-- 90% Friction Donut -->
    <circle cx="-60" cy="0" r="100" fill="none" stroke="#e63946" stroke-width="36" stroke-dasharray="314 628" />
    <circle cx="-60" cy="0" r="100" fill="none" stroke="#ffb703" stroke-width="36" stroke-dasharray="251 628" stroke-dashoffset="-314" />
    <circle cx="-60" cy="0" r="100" fill="none" stroke="#2a9d8f" stroke-width="36" stroke-dasharray="63 628" stroke-dashoffset="-565" />
    
    <text x="-60" y="-10" text-anchor="middle" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="20" font-weight="900">FRICTION</text>
    <text x="-60" y="18" text-anchor="middle" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">~90%</text>
    <text x="-60" y="38" text-anchor="middle" fill="#2a9d8f" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="700">CLAMP: 10%</text>

    <!-- Torque Wrench Silhouette -->
    <g transform="translate(100, -80) rotate(35)">
      <rect x="0" y="0" width="180" height="18" rx="4" fill="#a8b3cf" stroke="#fff" stroke-width="2" />
      <rect x="-25" y="-12" width="35" height="42" rx="6" fill="#1b202c" stroke="#4895ef" stroke-width="3" />
      <circle cx="-8" cy="9" r="8" fill="#ffd166" />
      <rect x="130" y="-4" width="70" height="26" rx="4" fill="#151922" stroke="#ffb703" stroke-width="2" />
      <text x="165" y="14" text-anchor="middle" fill="#ffb703" font-size="10" font-weight="700">SCALE</text>
    </g>

    <!-- Warning Callout -->
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="160" height="55" rx="6" fill="#151922" stroke="#e63946" stroke-width="2" />
      <text x="80" y="24" text-anchor="middle" fill="#ff758f" font-family="'Chakra Petch', sans-serif" font-size="13" font-weight="900">NO DOUBLE CLICK</text>
      <text x="80" y="42" text-anchor="middle" fill="#f4f6fb" font-size="10">二度締め +15% オーバー</text>
    </g>
  </g>

  <text x="80" y="580" fill="#707d9c" font-family="'Chakra Petch', sans-serif" font-size="14" letter-spacing="1">HONDA.CAT · NAOMI'S CIRCUIT MAINTENANCE CLINIC · ISSUE #5</text>
</svg>
