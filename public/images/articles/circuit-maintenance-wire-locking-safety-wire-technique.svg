<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0d0f14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#ffd166" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient light blobs -->
  <circle cx="950" cy="300" r="260" fill="#2a9d8f" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="200" r="200" fill="#c77dff" opacity="0.08" filter="url(#glow)" />

  <!-- Left Header Badges & Typography -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#c77dff" opacity="0.2" stroke="#c77dff" stroke-width="1.5" />
    <text x="110" y="22" text-anchor="middle" fill="#c77dff" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="700" letter-spacing="2">NAOMI'S WORKSHOP #1</text>

    <text x="0" y="90" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-size="44" font-weight="900" letter-spacing="1">安全ワイヤリングの絶対力学</text>
    <text x="0" y="145" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700">SAFETY WIRE-LOCKING &amp; PIGTAIL SAFETY</text>
    <text x="0" y="195" fill="#a8b3cf" font-family="'Noto Sans JP', sans-serif" font-size="18">MFJ技術規則準拠 · 締まり方向テンション · SUS304 0.8mm/0.6mm</text>

    <!-- Technical Specs Tag Box -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="460" height="150" rx="10" fill="#151922" stroke="#2a9d8f" stroke-width="1.5" opacity="0.9" />
      <text x="25" y="38" fill="#2a9d8f" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="700">SPECIFICATION CHECKLIST</text>
      
      <circle cx="35" cy="72" r="5" fill="#2a9d8f" />
      <text x="50" y="77" fill="#f4f6fb" font-size="15">Tension: Clockwise (締まり方向) 45°〜60°</text>

      <circle cx="35" cy="104" r="5" fill="#ffb703" />
      <text x="50" y="109" fill="#f4f6fb" font-size="15">Wire Pitch: 6〜8 Twists / Inch (25.4mm)</text>

      <circle cx="35" cy="134" r="5" fill="#c77dff" />
      <text x="50" y="139" fill="#f4f6fb" font-size="15">Termination: Pigtail 5mm Folded Inward</text>
    </g>
  </g>

  <!-- Right Side: Graphic Illustration of Bolt & Lock Wire -->
  <g transform="translate(850, 315)">
    <!-- Hexagon Bolt Head -->
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" fill="#1b202c" stroke="#4895ef" stroke-width="8" />
    <circle cx="0" cy="0" r="65" fill="#151922" stroke="#4895ef" stroke-width="4" />
    <text x="0" y="12" text-anchor="middle" fill="#f4f6fb" font-family="'Chakra Petch', sans-serif" font-size="24" font-weight="700">M12 DRAIN</text>

    <!-- Drill Hole -->
    <circle cx="65" cy="-60" r="12" fill="#ffd166" stroke="#ffffff" stroke-width="3" />

    <!-- Clockwise Rotation Arrow -->
    <path d="M -70,-90 A 120 120 0 0 1 70,-90" fill="none" stroke="#ffb703" stroke-width="5" stroke-dasharray="8,6" />
    <polygon points="70,-90 60,-105 85,-90 65,-75" fill="#ffb703" />
    <text x="0" y="-155" text-anchor="middle" fill="#ffb703" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">↻ TIGHTENING DIRECTION</text>

    <!-- Twisted Safety Wire Vector -->
    <path d="M 65,-60 Q 150,-50 240,40" fill="none" stroke="#2a9d8f" stroke-width="8" stroke-linecap="round" />
    <!-- Twist ridges -->
    <path d="M 95,-50 L 105,-38 M 125,-40 L 135,-28 M 155,-25 L 165,-13 M 185,-5 L 195,7 M 215,15 L 225,27" stroke="#f4f6fb" stroke-width="4" />

    <!-- Anchor Post -->
    <rect x="235" y="25" width="28" height="60" rx="5" fill="#3a4055" stroke="#ffffff" stroke-width="3" />
    <text x="249" y="110" text-anchor="middle" fill="#a8b3cf" font-family="'Chakra Petch', sans-serif" font-size="14">STAY</text>

    <!-- Pass Seal Badge -->
    <g transform="translate(-160, 110)">
      <circle cx="35" cy="35" r="35" fill="#2a9d8f" opacity="0.9" />
      <text x="35" y="42" text-anchor="middle" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="16" font-weight="900">PASS</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <text x="80" y="580" fill="#707d9c" font-family="'Chakra Petch', sans-serif" font-size="14" letter-spacing="1">HONDA.CAT · NAOMI'S CIRCUIT MAINTENANCE CLINIC · ISSUE #1</text>
</svg>
